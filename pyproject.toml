[project]
name = "alphapulse-otc"
version = "2.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.15,<4.0",
  "aiohttp>=3.10,<4.0",
  "aiosqlite>=0.20,<1.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "joblib>=1.4,<2.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "pocketoptionapi-async==2.0.1",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "scikit-learn>=1.5,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0"
]

[tool.vercel]
entrypoint = "api.main:app"
