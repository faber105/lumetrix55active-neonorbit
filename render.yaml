services:
  - type: web
    name: alphapulse-faber105-realtime
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: AUTO_REALTIME_DRIVER
        value: "false"
      - key: APP_RUNTIME_ROLE
        value: "web"
      - key: POCKET_OPTION_DEMO
        value: "true"
      - key: DATABASE_URL
        sync: false
