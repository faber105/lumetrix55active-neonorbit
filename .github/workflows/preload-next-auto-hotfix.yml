name: Next Entry Preload AUTO Hotfix

# retrigger: workflow already exists, so this push runs it
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preload-next-auto-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preload-next-auto-hotfix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch next-entry preload for both AUTO modes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/services/session_engine.py')
          s = p.read_text()

          anchor = '        "CREATE INDEX IF NOT EXISTS ix_auto_trade_sessions_active ON auto_trade_sessions (telegram_id,status,id DESC)",\n'
          repl = anchor + '        "ALTER TABLE auto_trade_sessions ADD COLUMN IF NOT EXISTS preload_next BOOLEAN NOT NULL DEFAULT FALSE",\n'
          if 'ADD COLUMN IF NOT EXISTS preload_next' not in s:
              if anchor not in s: raise SystemExit('schema anchor not found')
              s = s.replace(anchor, repl, 1)

          old = '            "max_martingale": max_martingale, "max_failed_series": 1,\n        }'
          new = '            "max_martingale": max_martingale, "max_failed_series": 1,\n            "preload_next": bool(config.get("preload_next", False)),\n        }'
          if '"preload_next": bool(config.get("preload_next", False))' not in s:
              if old not in s: raise SystemExit('count validate return not found')
              s = s.replace(old, new, 1)
              old = '            "max_martingale": max_martingale, "max_failed_series": failed,\n        }'
              new = '            "max_martingale": max_martingale, "max_failed_series": failed,\n            "preload_next": bool(config.get("preload_next", False)),\n        }'
              if old not in s: raise SystemExit('profit validate return not found')
              s = s.replace(old, new, 1)

          old = '''                    (telegram_id,mode,status,stage,strategy,timeframe,target_wins,target_profit,base_amount,max_martingale,max_failed_series,start_balance,current_balance,last_message)\n                    VALUES (:tid,:mode,'ACTIVE','SCANNING',:strategy,:tf,:tw,:tp,:amount,:mm,:mf,:balance,:balance,:msg)'''
          new = '''                    (telegram_id,mode,status,stage,strategy,timeframe,target_wins,target_profit,base_amount,max_martingale,max_failed_series,start_balance,current_balance,preload_next,last_message)\n                    VALUES (:tid,:mode,'ACTIVE','SCANNING',:strategy,:tf,:tw,:tp,:amount,:mm,:mf,:balance,:balance,:preload,:msg)'''
          if ':preload,:msg' not in s:
              if old not in s: raise SystemExit('insert columns block not found')
              s = s.replace(old, new, 1)
              old = '                    "mm": values["max_martingale"], "mf": values["max_failed_series"], "balance": balance,\n                    "msg": "Сессия запущена · анализирую все OTC пары",'
              new = '                    "mm": values["max_martingale"], "mf": values["max_failed_series"], "balance": balance,\n                    "preload": bool(values.get("preload_next")),\n                    "msg": "Сессия запущена · анализирую все OTC пары",'
              if old not in s: raise SystemExit('insert params block not found')
              s = s.replace(old, new, 1)

          helper_anchor = '\ndef _payout(snapshot: dict, asset: str) -> float | None:\n'
          if 'async def _prepare_next_before_expiry' not in s:
              helper = r'''

def _naive_utc(value):
    if isinstance(value, datetime):
        dt = value
    else:
        dt = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
    if dt.tzinfo:
        dt = dt.astimezone(timezone.utc).replace(tzinfo=None)
    return dt.replace(tzinfo=None)


async def _prepare_next_before_expiry(session):
    if not bool(session.get("preload_next")) or not session.get("active_position_id"):
        return None
    if session.get("pending_signal_id"):
        return {"status": "READY", "signal_id": int(session["pending_signal_id"])}

    async with AsyncSessionLocal() as db:
        position = await db.get(PaperPosition, int(session["active_position_id"]))
    if position is None or position.status != "OPEN" or not position.expiry_time:
        return None

    expiry = _naive_utc(position.expiry_time)
    remaining = (expiry - utcnow()).total_seconds()
    timeframe = str(session.get("timeframe") or "5m")
    lead = 120.0 if session.get("mode") == "profit" else {"15s": 15.0, "1m": 60.0, "3m": 120.0}.get(timeframe, 120.0)
    if remaining <= 0 or remaining > lead:
        return None

    snapshot = await get_demo_account_snapshot()
    all_assets = list(OTC_ASSETS.keys())
    strategy = str(session.get("strategy") or "smart_confluence")
    mixed_count = session.get("mode") == "count"
    if mixed_count:
        candidates = await signal_engine.scan_best_candidates(timeframe, all_assets)
        threshold = COUNT_MIN_CONFIDENCE
    elif strategy == "smart_confluence":
        candidates = await signal_engine.scan_best_candidates(PROFIT_TIMEFRAME, all_assets)
        threshold = PROFIT_MIN_CONFIDENCE
    else:
        candidates = await signal_engine.scan_strategy_candidates(PROFIT_TIMEFRAME, all_assets, strategy)
        threshold = PROFIT_MIN_CONFIDENCE

    confirmed = [c for c in candidates if float(c.get("confidence") or 0) >= threshold and _tradable(snapshot, str(c.get("asset") or ""))]
    for candidate in confirmed:
        candidate_to_save = candidate
        if mixed_count:
            try:
                recheck = await signal_engine.evaluate_asset(str(candidate.get("asset") or ""), timeframe, str(candidate.get("strategy") or ""))
            except Exception:
                recheck = None
            if not recheck or recheck.get("direction") != candidate.get("direction") or float(recheck.get("confidence") or 0) < COUNT_CONFIRM_CONFIDENCE:
                continue
            candidate_to_save = recheck

        try:
            candidate_entry = _naive_utc(candidate_to_save.get("entry_time"))
        except Exception:
            continue
        if abs((candidate_entry - expiry).total_seconds()) > 3.0:
            continue

        stored, duplicate = await save_signal(candidate_to_save, is_vip=False)
        if duplicate:
            continue
        payout = _payout(snapshot, stored["asset"])
        if payout is None or payout < MIN_AUTO_PAYOUT:
            continue
        amount = _next_amount(session, payout)
        await _update(int(session["id"]), pending_signal_id=int(stored["id"]), last_message=f"Сделка открыта · следующий вход {stored['pair']} уже подтверждён к {stored['entry_time']}")
        await update_trade_runtime(stage="PRE_ANALYSIS_READY", pending_signal_id=int(stored["id"]), pair=stored["pair"], asset=stored["asset"], strategy=stored["strategy"], timeframe=stored["timeframe"], payout_percent=payout, balance=snapshot.get("balance"), entry_time=stored["entry_time"], expiry_time=stored["expiry_time"], amount=amount, message="Текущая сделка ещё открыта · следующий сетап подтверждён и ждёт точную границу свечи")
        await _event(int(session["id"]), "PRE_ANALYSIS_READY", f"Следующий вход подготовлен {stored['pair']} {stored['direction']}", {"signal_id": int(stored["id"]), "entry_time": stored["entry_time"], "remaining": round(remaining, 1), "amount": amount})
        return {"status": "READY", "signal_id": int(stored["id"]), "entry_time": stored["entry_time"]}

    await _update(int(session["id"]), last_message=f"Сделка открыта · до закрытия {max(0, int(remaining))}с · параллельно анализирую следующий вход")
    return {"status": "SEARCHING", "seconds_to_expiry": max(0, round(remaining, 1))}
'''
              if helper_anchor not in s: raise SystemExit('helper anchor not found')
              s = s.replace(helper_anchor, helper + helper_anchor, 1)

          old = '''    if session.get("active_position_id"):\n        await _update(int(session["id"]), stage="OPEN", last_message="Сделка открыта · слежу за графиком и экспирацией")\n        return {"status": "OPEN", "position_id": session.get("active_position_id")}\n'''
          new = '''    if session.get("active_position_id"):\n        preload = await _prepare_next_before_expiry(session)\n        if preload and preload.get("status") in {"READY", "SEARCHING"}:\n            return {"status": "OPEN_PRE_ANALYSIS", "position_id": session.get("active_position_id"), "preload": preload}\n        await _update(int(session["id"]), stage="OPEN", last_message="Сделка открыта · слежу за графиком и экспирацией")\n        return {"status": "OPEN", "position_id": session.get("active_position_id")}\n'''
          if 'OPEN_PRE_ANALYSIS' not in s:
              if old not in s: raise SystemExit('active position block not found')
              s = s.replace(old, new, 1)

          old = '''    await _update(\n        session_id, status=status, stage=stage, wins=wins, failed_series=failed, current_level=level,\n        current_series_loss=series_loss, profit=profit, current_balance=balance, active_position_id=None,\n        pending_signal_id=None, last_message=message, stop_reason=reason, ended_at=ended,\n    )'''
          new = '''    preserved_pending = session.get("pending_signal_id") if status == "ACTIVE" and bool(session.get("preload_next")) else None\n    await _update(\n        session_id, status=status, stage=stage, wins=wins, failed_series=failed, current_level=level,\n        current_series_loss=series_loss, profit=profit, current_balance=balance, active_position_id=None,\n        pending_signal_id=preserved_pending, last_message=message, stop_reason=reason, ended_at=ended,\n    )'''
          if 'preserved_pending = session.get("pending_signal_id")' not in s:
              if old not in s: raise SystemExit('settle update block not found')
              s = s.replace(old, new, 1)

          old = '''    if status != "ACTIVE":\n        await reset_trade_runtime("IDLE", message)\n        await _event(session_id, stage, message, {"wins": wins, "failed_series": failed, "profit": profit})\n    else:\n        await reset_trade_runtime(stage, message)\n'''
          new = '''    if status != "ACTIVE":\n        await reset_trade_runtime("IDLE", message)\n        await _event(session_id, stage, message, {"wins": wins, "failed_series": failed, "profit": profit})\n    elif preserved_pending:\n        await update_trade_runtime(stage="WAIT_ENTRY", pending_signal_id=int(preserved_pending), message=f"{message} · следующий подтверждённый вход уже подготовлен")\n    else:\n        await reset_trade_runtime(stage, message)\n'''
          if 'elif preserved_pending:' not in s:
              if old not in s: raise SystemExit('settle runtime block not found')
              s = s.replace(old, new, 1)

          old = '''    if session.get("pending_signal_id"):\n        pending = await _load_signal(int(session["pending_signal_id"]))\n        trade = await process_pending_auto_trade()\n'''
          new = '''    if session.get("pending_signal_id"):\n        pending = await _load_signal(int(session["pending_signal_id"]))\n        runtime_before = await get_trade_runtime()\n        payout_before = float(runtime_before.get("payout_percent") or MIN_AUTO_PAYOUT)\n        amount_before = _next_amount(session, payout_before)\n        await update_auto_trade_control(amount=amount_before, max_open_positions=1)\n        await update_trade_runtime(amount=amount_before)\n        trade = await process_pending_auto_trade()\n'''
          if 'runtime_before = await get_trade_runtime()' not in s:
              if old not in s: raise SystemExit('pending block not found')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('backend/routers/auto.py')
          s = p.read_text()
          old = '    max_martingale: int = 3\n    max_failed_series: int = 1\n'
          new = '    max_martingale: int = 3\n    max_failed_series: int = 1\n    preload_next: bool = False\n'
          if 'preload_next: bool = False' not in s:
              if old not in s: raise SystemExit('StartSessionRequest anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('miniapp/src/App.jsx')
          s = p.read_text()
          old = 'const[mode,setMode]=useState("count"),[strategy,setStrategy]=useState("smart_confluence"),[timeframe,setTimeframe]=useState("1m");'
          new = 'const[mode,setMode]=useState("count"),[strategy,setStrategy]=useState("smart_confluence"),[timeframe,setTimeframe]=useState("1m"),[preloadNext,setPreloadNext]=useState(false);'
          if '[preloadNext,setPreloadNext]' not in s:
              if old not in s: raise SystemExit('AutoTab state anchor not found')
              s = s.replace(old, new, 1)

          old = 'max_martingale:Number(martingale),max_failed_series:failed});'
          new = 'max_martingale:Number(martingale),max_failed_series:failed,preload_next:preloadNext});'
          if 'preload_next:preloadNext' not in s:
              if old not in s: raise SystemExit('start payload anchor not found')
              s = s.replace(old, new, 1)

          old = 'value={mode} onChange={v=>{setMode(v);setStrategy("smart_confluence")}}/></div><div><small className="label">Стратегия</small>'
          new = 'value={mode} onChange={v=>{setMode(v);setStrategy("smart_confluence")}}/></div><div className="admin-row"><div><div><b>Заранее готовить следующий вход</b><small>{mode==="profit"?"ON: за 2 минуты до закрытия 5m сделки бот анализирует рынок к следующей 5m свече":"ON: анализ следующего входа начинается заранее, пока текущая сделка ещё открыта"}</small></div></div><Toggle value={preloadNext} onChange={setPreloadNext}/></div><div><small className="label">Стратегия</small>'
          if 'Заранее готовить следующий вход' not in s:
              if old not in s: raise SystemExit('mode UI anchor not found')
              s = s.replace(old, new, 1)

          old = '<div><small>Payout filter</small><b>≥92%</b></div></div><div className="robot-status">'
          new = '<div><small>Payout filter</small><b>≥92%</b></div><div><small>Следующий вход заранее</small><b>{session.preload_next?"ON":"OFF"}</b></div></div><div className="robot-status">'
          if 'Следующий вход заранее' not in s:
              if old not in s: raise SystemExit('live KPI anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          python -m compileall -q backend
          git diff --check
          git status --short
      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'AlphaPulse Hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/services/session_engine.py backend/routers/auto.py miniapp/src/App.jsx
          git commit -m 'Preload next entry before current AUTO trade closes'
          git push origin HEAD:main
