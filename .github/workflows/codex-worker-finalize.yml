name: Finalize Windows worker safety and state machine

on:
  push:
    branches: [codex-windows-worker-rebuild]
    paths:
      - .github/workflows/codex-worker-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-windows-worker-rebuild
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply worker architecture finalization
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Session stages exposed by the durable session record are canonical.
          p = Path('backend/services/session_engine.py')
          text = p.read_text(encoding='utf-8')
          anchor = '_SCHEMA_READY = False\n'
          insert = '''_SCHEMA_READY = False\n\nSESSION_STAGES = {"CREATED", "SCANNING", "PREPARING", "OPENING", "OPEN", "RESOLVING", "COMPLETED", "STOPPED", "FAILED"}\n_STAGE_ALIASES = {\n    "WAIT_PAYOUT": "SCANNING",\n    "MARTINGALE": "SCANNING",\n    "SIGNAL_FOUND": "PREPARING",\n    "WAIT_ENTRY": "PREPARING",\n    "SCHEDULED": "PREPARING",\n    "PREPARED": "PREPARING",\n    "PRELOAD_RETRY": "PREPARING",\n    "WAIT_CLOSE": "RESOLVING",\n    "RECONCILING": "RESOLVING",\n    "MISSED_ENTRY": "SCANNING",\n}\n\ndef _canonical_stage(value: object) -> str:\n    stage = str(value or "SCANNING").upper()\n    stage = _STAGE_ALIASES.get(stage, stage)\n    return stage if stage in SESSION_STAGES else "SCANNING"\n'''
          if 'SESSION_STAGES = {' not in text:
              if anchor not in text:
                  raise SystemExit('session stage anchor missing')
              text = text.replace(anchor, insert, 1)
              p.write_text(text, encoding='utf-8')

          replace(
              'backend/services/session_engine.py',
              '''async def _update(session_id, **changes):\n    changes = {key: value for key, value in changes.items() if key in _ALLOWED}\n    if not changes:\n        return\n''',
              '''async def _update(session_id, **changes):\n    changes = {key: value for key, value in changes.items() if key in _ALLOWED}\n    if "stage" in changes:\n        changes["stage"] = _canonical_stage(changes["stage"])\n    if not changes:\n        return\n'''
          )

          replace(
              'backend/services/session_engine.py',
              '''async def stop_session(reason="USER_STOP"):\n    session = await _active()\n    if not session:\n        return await session_state()\n    await _update(\n        int(session["id"]), status="STOPPED", stage="STOPPED", stop_reason=reason,\n        last_message="Сессия остановлена", ended_at=utcnow(), pending_signal_id=None, active_position_id=None,\n    )\n    await reset_trade_runtime("IDLE", "AUTO сессия остановлена")\n    await _event(int(session["id"]), "STOPPED", "Сессия остановлена", {"reason": reason})\n    return await session_state(refresh_balance=True)\n''',
              '''async def stop_session(reason="USER_STOP"):\n    session = await _active()\n    if not session:\n        return await session_state()\n    session_id = int(session["id"])\n    if session.get("active_position_id"):\n        # Never abandon an already accepted Pocket order. Stop new entries now,\n        # keep the session active only long enough to reconcile the open deal,\n        # then _settle converts it to terminal STOPPED in the same transaction.\n        await set_execution_mode("confirm")\n        await _update(\n            session_id, stage="OPEN", stop_reason="USER_STOP_PENDING", pending_signal_id=None,\n            last_message="Остановка запрошена · жду результат уже открытой сделки",\n        )\n        await _event(session_id, "STOP_REQUESTED", "Остановка запрошена · открытая сделка будет учтена", {"reason": reason})\n        return await session_state(refresh_balance=True)\n    await _update(\n        session_id, status="STOPPED", stage="STOPPED", stop_reason=reason,\n        last_message="Сессия остановлена", ended_at=utcnow(), pending_signal_id=None, active_position_id=None,\n    )\n    await reset_trade_runtime("IDLE", "AUTO сессия остановлена")\n    await _event(session_id, "STOPPED", "Сессия остановлена", {"reason": reason})\n    return await session_state(refresh_balance=True)\n'''
          )

          replace(
              'backend/services/session_engine.py',
              '''            transition = settle_transition(\n                dict(locked_session),\n                result=result,\n                amount=amount,\n                payout=payout,\n            )\n            leg_id = int(leg["id"])\n''',
              '''            transition = settle_transition(\n                dict(locked_session),\n                result=result,\n                amount=amount,\n                payout=payout,\n            )\n            if str(locked_session.get("stop_reason") or "") == "USER_STOP_PENDING" and transition["status"] == "ACTIVE":\n                transition.update(\n                    status="STOPPED",\n                    stage="STOPPED",\n                    reason="USER_STOP",\n                    ended=utcnow(),\n                    message=f"Сделка закрыта · {transition['result']} · сессия остановлена пользователем",\n                )\n            transition["stage"] = _canonical_stage(transition["stage"])\n            leg_id = int(leg["id"])\n'''
          )

          # A martingale level is session data, not a separate durable state.
          replace(
              'backend/services/session_transitions.py',
              '"stage": "MARTINGALE",',
              '"stage": "SCANNING",'
          )

          # Web/UI helper understands the canonical PREPARING state.
          replace(
              'backend/routers/auto.py',
              '''if current_bet is None and str(session.get("stage") or "") in {"SIGNAL_FOUND", "WAIT_ENTRY", "SCHEDULED", "OPENING"}:''',
              '''if current_bet is None and str(session.get("stage") or "") in {"PREPARING", "SIGNAL_FOUND", "WAIT_ENTRY", "SCHEDULED", "OPENING"}:'''
          )

          # Keep worker loop hot for canonical time-sensitive states too.
          p = Path('backend/services/auto_realtime.py')
          text = p.read_text(encoding='utf-8')
          if '"PREPARING",\n            "RESOLVING",' not in text:
              text = text.replace(
                  'status in {\n            "OPEN",\n            "OPENING",',
                  'status in {\n            "OPEN",\n            "OPENING",\n            "PREPARING",\n            "RESOLVING",',
                  1,
              )
              p.write_text(text, encoding='utf-8')

          # Broker execution: explicit funds gate and a durable UNKNOWN/EXECUTING fence.
          p = Path('backend/services/auto_trade.py')
          text = p.read_text(encoding='utf-8')
          marker = '''async def _mark_execution(execution_id: int, status: str, error: str | None = None) -> None:\n    async with AsyncSessionLocal() as db:\n        row = await db.get(TradeExecution, execution_id)\n        if row is not None:\n            row.status = str(status)[:20]\n            row.error = str(error)[:128] if error else None\n            await db.commit()\n\n\n'''
          helper = marker + '''async def _unresolved_execution(signal_id: int) -> dict | None:\n    async with AsyncSessionLocal() as db:\n        row = (\n            await db.execute(\n                select(TradeExecution)\n                .where(\n                    TradeExecution.signal_id == int(signal_id),\n                    TradeExecution.status.in_(["EXECUTING", "UNKNOWN"]),\n                )\n                .limit(1)\n            )\n        ).scalar_one_or_none()\n    if row is None:\n        return None\n    return {\n        "execution_id": int(row.id),\n        "status": str(row.status),\n        "broker_order_id": row.broker_order_id,\n    }\n\n\n'''
          if 'async def _unresolved_execution' not in text:
              if marker not in text:
                  raise SystemExit('auto_trade mark execution anchor missing')
              text = text.replace(marker, helper, 1)

          guard_anchor = '''    if int(active_session.get("pending_signal_id") or 0) != int(signal.get("id") or 0):\n        return {"status": "SIGNAL_NOT_CLAIMED"}\n    if not confirmed and await get_execution_mode() != "auto":\n'''
          guard_new = '''    if int(active_session.get("pending_signal_id") or 0) != int(signal.get("id") or 0):\n        return {"status": "SIGNAL_NOT_CLAIMED"}\n    unresolved = await _unresolved_execution(int(signal.get("id") or 0))\n    if unresolved is not None:\n        return {\n            "status": "RECONCILING",\n            "reason": "UNRESOLVED_BROKER_EXECUTION",\n            **unresolved,\n        }\n    if not confirmed and await get_execution_mode() != "auto":\n'''
          if 'UNRESOLVED_BROKER_EXECUTION' not in text:
              if guard_anchor not in text:
                  raise SystemExit('auto_trade guard anchor missing')
              text = text.replace(guard_anchor, guard_new, 1)

          payout_anchor = '''            payout = payout_for_asset(snapshot, signal["asset"])\n            if payout is None or payout < MIN_AUTO_PAYOUT:\n                await reset_trade_runtime("PAYOUT_TOO_LOW", f"Выплата {payout if payout is not None else '—'}% < {MIN_AUTO_PAYOUT:g}% — сигнал пропущен")\n                return {"status": "PAYOUT_TOO_LOW", "payout": payout, "min_payout": MIN_AUTO_PAYOUT}\n\n            if exact_entry:\n'''
          payout_new = '''            payout = payout_for_asset(snapshot, signal["asset"])\n            if payout is None or payout < MIN_AUTO_PAYOUT:\n                await reset_trade_runtime("PAYOUT_TOO_LOW", f"Выплата {payout if payout is not None else '—'}% < {MIN_AUTO_PAYOUT:g}% — сигнал пропущен")\n                return {"status": "PAYOUT_TOO_LOW", "payout": payout, "min_payout": MIN_AUTO_PAYOUT}\n            broker_balance = snapshot.get("balance")\n            if broker_balance is not None and float(broker_balance) + 1e-9 < float(amount):\n                await update_trade_runtime(\n                    stage="STOPPED", pending_signal_id=None, balance=float(broker_balance), amount=amount,\n                    message=f"Недостаточно средств · баланс {float(broker_balance):.2f}, для следующей сделки нужно {amount:.2f}",\n                )\n                return {\n                    "status": "STOP_REQUIRED",\n                    "reason": "INSUFFICIENT_FUNDS",\n                    "balance": float(broker_balance),\n                    "required": float(amount),\n                }\n\n            if exact_entry:\n'''
          if '"required": float(amount)' not in text:
              if payout_anchor not in text:
                  raise SystemExit('auto_trade payout anchor missing')
              text = text.replace(payout_anchor, payout_new, 1)
          p.write_text(text, encoding='utf-8')

          # Tests for canonical stages and user-stop semantics at transition level.
          Path('tests/test_canonical_session_stages.py').write_text('''from backend.services.session_engine import _canonical_stage, SESSION_STAGES\nfrom backend.services.session_transitions import settle_transition\n\n\ndef test_legacy_runtime_stages_map_to_canonical_session_states():\n    assert _canonical_stage("WAIT_ENTRY") == "PREPARING"\n    assert _canonical_stage("SCHEDULED") == "PREPARING"\n    assert _canonical_stage("RECONCILING") == "RESOLVING"\n    assert _canonical_stage("WAIT_PAYOUT") == "SCANNING"\n    assert _canonical_stage("MARTINGALE") == "SCANNING"\n    assert _canonical_stage("OPEN") == "OPEN"\n    assert _canonical_stage("nonsense") == "SCANNING"\n    assert {"CREATED", "SCANNING", "PREPARING", "OPENING", "OPEN", "RESOLVING", "COMPLETED", "STOPPED", "FAILED"} == SESSION_STAGES\n\n\ndef test_loss_cover_uses_scanning_state_not_martingale_state():\n    session = {\n        "mode": "count", "target_wins": 5, "wins": 0, "failed_series": 0,\n        "current_level": 0, "current_series_loss": 0, "profit": 0,\n        "max_martingale": 3, "max_failed_series": 1,\n    }\n    transition = settle_transition(session, result="LOSS", amount=1, payout=92)\n    assert transition["status"] == "ACTIVE"\n    assert transition["stage"] == "SCANNING"\n    assert transition["level"] == 1\n''', encoding='utf-8')
      - name: Install test dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Validate Python and worker tests
        run: |
          python -m compileall -q backend worker api bot
          pytest -q tests/test_runtime_role.py tests/test_security_boundaries.py tests/test_session_loss_transition.py tests/test_session_settle_transition.py tests/test_fake_broker_scenarios.py tests/test_command_idempotency.py tests/test_auto_session_config.py tests/test_canonical_session_stages.py
      - name: Commit finalized worker changes
        run: |
          git config user.name "AlphaPulse Worker Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add backend tests .github/workflows/codex-worker-finalize.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finalize worker safety and canonical session states"
          git push origin HEAD:codex-windows-worker-rebuild
