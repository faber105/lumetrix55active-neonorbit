name: Build AlphaPulse Runtime Bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-runtime-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniapp/package.json

      - name: Build Mini App
        run: |
          npm --prefix miniapp install --no-audit --no-fund
          npm --prefix miniapp run build

      - name: Create secret-free runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alphapulse-bundle
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('.')
          output = Path('/tmp/alphapulse-bundle/runtime.zip')
          skip_dirs = {'.git', '.github', 'node_modules', '__pycache__', '.vercel'}
          skip_files = {'runtime_bootstrap.json', 'runtime_secrets.json', '.env'}

          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  rel = path.relative_to(root)
                  if any(part in skip_dirs for part in rel.parts):
                      continue
                  if rel.name in skip_files:
                      continue
                  zf.write(path, rel.as_posix())
          print(f'Runtime bundle: {output.stat().st_size} bytes')
          PY
          base64 -w0 /tmp/alphapulse-bundle/runtime.zip > /tmp/alphapulse-bundle/runtime.b64
          split -b 45000 -d -a 2 /tmp/alphapulse-bundle/runtime.b64 /tmp/alphapulse-bundle/part_
          rm /tmp/alphapulse-bundle/runtime.zip /tmp/alphapulse-bundle/runtime.b64
          printf '%s\n' "$GITHUB_SHA" > /tmp/alphapulse-bundle/source_sha.txt
          sha256sum /tmp/alphapulse-bundle/part_* > /tmp/alphapulse-bundle/checksums.txt
          ls -lh /tmp/alphapulse-bundle

      - name: Publish generated bundle branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan runtime-bundle-generated
          git rm -rf .
          cp /tmp/alphapulse-bundle/* .
          git add part_* source_sha.txt checksums.txt
          git commit -m "Generated runtime bundle for $GITHUB_SHA"
          git push --force origin HEAD:runtime-bundle-generated
