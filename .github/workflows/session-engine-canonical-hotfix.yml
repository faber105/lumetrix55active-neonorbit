name: Canonical session engine hotfix

on:
  push:
    branches: [codex-windows-worker-rebuild]
    paths:
      - .github/workflows/session-engine-canonical-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex-windows-worker-rebuild
          fetch-depth: 0
      - name: Patch canonical states and safe stop
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/services/session_engine.py')
          text = p.read_text(encoding='utf-8')

          if 'SESSION_STAGES = {' not in text:
              anchor = 'MAX_SESSION_AMOUNT = 50000.0\n_SCHEMA_READY = False\n'
              repl = '''MAX_SESSION_AMOUNT = 50000.0\nSESSION_STAGES = {"CREATED", "SCANNING", "PREPARING", "OPENING", "OPEN", "RESOLVING", "COMPLETED", "STOPPED", "FAILED"}\n_STAGE_ALIASES = {\n    "WAIT_PAYOUT": "SCANNING", "MARTINGALE": "SCANNING", "SIGNAL_FOUND": "PREPARING",\n    "WAIT_ENTRY": "PREPARING", "SCHEDULED": "PREPARING", "PREPARED": "PREPARING",\n    "PRELOAD_RETRY": "PREPARING", "WAIT_CLOSE": "RESOLVING", "RECONCILING": "RESOLVING",\n    "MISSED_ENTRY": "SCANNING", "CLOSED": "RESOLVING",\n}\n\ndef _canonical_stage(value):\n    stage = str(value or "SCANNING").upper()\n    stage = _STAGE_ALIASES.get(stage, stage)\n    return stage if stage in SESSION_STAGES else "SCANNING"\n\n_SCHEMA_READY = False\n'''
              if anchor not in text:
                  raise SystemExit('stage anchor not found')
              text = text.replace(anchor, repl, 1)

          old = '''async def _update(session_id, **changes):\n    changes = {key: value for key, value in changes.items() if key in _ALLOWED}\n    if not changes:\n        return\n'''
          new = '''async def _update(session_id, **changes):\n    changes = {key: value for key, value in changes.items() if key in _ALLOWED}\n    if "stage" in changes:\n        changes["stage"] = _canonical_stage(changes["stage"])\n    if not changes:\n        return\n'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''async def stop_session(reason="USER_STOP"):\n    session = await _active()\n    if not session:\n        return await session_state()\n    await _update(\n        int(session["id"]), status="STOPPED", stage="STOPPED", stop_reason=reason,\n        last_message="Сессия остановлена", ended_at=utcnow(), pending_signal_id=None, active_position_id=None,\n    )\n    await reset_trade_runtime("IDLE", "AUTO сессия остановлена")\n    await _event(int(session["id"]), "STOPPED", "Сессия остановлена", {"reason": reason})\n    return await session_state(refresh_balance=True)\n'''
          new = '''async def stop_session(reason="USER_STOP"):\n    session = await _active()\n    if not session:\n        return await session_state()\n    session_id = int(session["id"])\n    if session.get("active_position_id"):\n        await set_execution_mode("confirm")\n        await _update(\n            session_id, stage="OPEN", stop_reason="USER_STOP_PENDING", pending_signal_id=None,\n            last_message="Остановка запрошена · жду результат уже открытой сделки",\n        )\n        await _event(session_id, "STOP_REQUESTED", "Остановка запрошена · открытая сделка будет учтена", {"reason": reason})\n        return await session_state(refresh_balance=True)\n    await _update(\n        session_id, status="STOPPED", stage="STOPPED", stop_reason=reason,\n        last_message="Сессия остановлена", ended_at=utcnow(), pending_signal_id=None, active_position_id=None,\n    )\n    await reset_trade_runtime("IDLE", "AUTO сессия остановлена")\n    await _event(session_id, "STOPPED", "Сессия остановлена", {"reason": reason})\n    return await session_state(refresh_balance=True)\n'''
          if old in text:
              text = text.replace(old, new, 1)

          old = '''            transition = settle_transition(\n                dict(locked_session),\n                result=result,\n                amount=amount,\n                payout=payout,\n            )\n            leg_id = int(leg["id"])\n'''
          new = '''            transition = settle_transition(\n                dict(locked_session),\n                result=result,\n                amount=amount,\n                payout=payout,\n            )\n            if str(locked_session.get("stop_reason") or "") == "USER_STOP_PENDING" and transition["status"] == "ACTIVE":\n                transition.update(\n                    status="STOPPED", stage="STOPPED", reason="USER_STOP", ended=utcnow(),\n                    message=f"Сделка закрыта · {transition['result']} · сессия остановлена пользователем",\n                )\n            transition["stage"] = _canonical_stage(transition["stage"])\n            leg_id = int(leg["id"])\n'''
          if old in text:
              text = text.replace(old, new, 1)

          text = text.replace('stage="SIGNAL_FOUND", pending_signal_id=int(signal["id"]),', 'stage="PREPARING", pending_signal_id=int(signal["id"]),')
          text = text.replace('stage="WAIT_ENTRY", pending_signal_id=int(signal["id"]),', 'stage="PREPARING", pending_signal_id=int(signal["id"]),')
          text = text.replace('stage="RECONCILING", pending_signal_id=int(signal["id"]),', 'stage="RESOLVING", pending_signal_id=int(signal["id"]),')
          text = text.replace('stage="RECONCILING",\n                last_message=', 'stage="RESOLVING",\n                last_message=')
          p.write_text(text, encoding='utf-8')
      - name: Validate syntax and markers
        run: |
          python -m compileall -q backend worker
          grep -q 'SESSION_STAGES = {' backend/services/session_engine.py
          grep -q 'USER_STOP_PENDING' backend/services/session_engine.py
          grep -q '_canonical_stage' backend/services/session_engine.py
      - name: Commit
        run: |
          git config user.name "AlphaPulse Worker Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add backend/services/session_engine.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Canonicalize AUTO session state machine"
          git push origin HEAD:codex-windows-worker-rebuild
