name: Force Mini App URL Hotfix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/force-miniapp-url-hotfix.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Force stable Mini App production URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bot/main.py')
          s=p.read_text()
          old='MINI_APP_URL = os.getenv("MINI_APP_URL", BACKEND_URL)'
          new='MINI_APP_URL = "https://alphapulse-runtime-staging.vercel.app/?v=20260820-2253"'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('MINI_APP_URL anchor not found')
          p.write_text(s)
          PY
          git config user.name 'AlphaPulse Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add bot/main.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Force Telegram Mini App to current production URL'
          git push origin main
