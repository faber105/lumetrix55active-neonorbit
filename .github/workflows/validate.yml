name: Validate AlphaPulse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alphapulse-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python
        run: python -m compileall -q api backend bot

      - name: Install Python dependencies
        run: pip install -e .

      - name: Import FastAPI application
        env:
          TELEGRAM_BOT_TOKEN: '123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijk'
          ADMIN_ID: '8535011479'
          DATABASE_URL: 'postgresql://alpha:alphapulse123@localhost:5432/alphapulse'
        run: python -c "from api.main import app; assert app.title == 'AlphaPulse API'; print('FastAPI import OK')"

      - name: Verify guarded trade primitives and Pocket telemetry parser
        env:
          ADMIN_ID: '8535011479'
          DATABASE_URL: 'postgresql://alpha:alphapulse123@localhost:5432/alphapulse'
        run: |
          python - <<'PY'
          from backend.models.db_models import AutoTradeControl, TradeExecution
          from backend.services.auto_trade import MIN_AUTO_PAYOUT, execute_confirmed_signal, maybe_execute_signal, process_pending_auto_trade, serialize_auto_trade
          from backend.services.pocket_demo_trading import DirectDemoTradingClient
          from backend.services.pocket_telemetry import TelemetryPocketOptionClient
          from backend.services.trade_mode import VALID_EXECUTION_MODES, VALID_TRADE_MODES
          state = serialize_auto_trade(None)
          assert state['auto_trade_enabled'] is False
          assert state['trade_amount'] == 1.0
          assert MIN_AUTO_PAYOUT == 92.0
          assert VALID_EXECUTION_MODES == {'auto', 'confirm'}
          assert VALID_TRADE_MODES == {'demo', 'real'}
          assert callable(maybe_execute_signal) and callable(process_pending_auto_trade) and callable(execute_confirmed_signal)
          assert DirectDemoTradingClient.__name__ == 'DirectDemoTradingClient'
          client = TelemetryPocketOptionClient('test', is_demo=True)
          client._capture_telemetry('successupdateBalance', {'balance': '1234.56', 'isDemo': 1})
          row = [1, 'EURUSD_otc', 'EUR/USD OTC', 'currency', 0, 92, 0, 0, 0, 0, 0, 0, 0, 0, True, [60]]
          client._capture_telemetry('updateAssets', [row])
          snap = client.snapshot()
          assert snap['balance'] == 1234.56
          assert snap['balance_is_demo'] is True
          assert snap['payouts']['EURUSD_otc'] == 92.0
          assert snap['available_assets']['EURUSD_otc'] is True
          assert AutoTradeControl.__tablename__ == 'auto_trade_control'
          assert TradeExecution.__tablename__ == 'trade_executions'
          print('Trade timing/payout telemetry guardrails OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniapp/package.json

      - name: Install Mini App dependencies
        working-directory: miniapp
        run: npm install --no-audit --no-fund

      - name: Build Mini App
        working-directory: miniapp
        run: npm run build

      - name: Verify Mini App information architecture
        working-directory: miniapp
        run: |
          grep -R -q 'Сканировать рынок' dist/assets/*.js
          grep -R -q 'Статистика' dist/assets/*.js
          grep -R -q 'Запустить тестовую DEMO автосделку' dist/assets/*.js
          grep -R -q 'CONFIRM' dist/assets/*.js
          grep -R -q 'Жду точное время входа' dist/assets/*.js
          grep -R -q 'Баланс' dist/assets/*.js
          grep -R -q 'Выплата' dist/assets/*.js
          echo 'Mini App AUTO monitor OK'

      - name: Verify stale Telegram asset recovery
        env:
          ADMIN_ID: '8535011479'
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.main import app
          with TestClient(app) as client:
              root = client.get('/')
              assert root.status_code == 200, root.text
              assert root.headers.get('cache-control') == 'no-store, max-age=0'
              stale_js = client.get('/assets/index-stale-telegram-cache.js')
              assert stale_js.status_code == 200, stale_js.text
              assert stale_js.headers.get('x-alphapulse-asset-recovery') == '1'
              stale_css = client.get('/assets/index-stale-telegram-cache.css')
              assert stale_css.status_code == 200, stale_css.text
              assert stale_css.headers.get('x-alphapulse-asset-recovery') == '1'
          print('Stale asset recovery OK')
          PY
