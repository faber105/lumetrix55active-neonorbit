name: Validate AlphaPulse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alphapulse-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python
        run: python -m compileall -q api backend bot

      - name: Install Python dependencies
        run: pip install -e .

      - name: Import FastAPI application
        env:
          TELEGRAM_BOT_TOKEN: '123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijk'
          ADMIN_ID: '8535011479'
          DATABASE_URL: 'postgresql://alpha:alphapulse123@localhost:5432/alphapulse'
        run: |
          python - <<'PY'
          from api.main import app
          assert app.title == 'AlphaPulse API'
          assert app.version == '3.0'
          print('FastAPI 3.0 import OK')
          PY

      - name: Verify strategies and AUTO session configuration
        env:
          ADMIN_ID: '8535011479'
          DATABASE_URL: 'postgresql://alpha:alphapulse123@localhost:5432/alphapulse'
        run: |
          python - <<'PY'
          from backend.services.auto_trade import MIN_AUTO_PAYOUT
          from backend.services.session_engine import (
              AUTO_STRATEGIES,
              COUNT_TIMEFRAMES,
              PROFIT_TIMEFRAME,
              PROFIT_STRATEGIES,
              _validate_config,
          )
          from backend.services.strategies import STRATEGIES

          assert tuple(AUTO_STRATEGIES) == ('trend_pulse', 'range_reversal', 'volatility_breakout')
          assert 'vip_confluence' in STRATEGIES
          assert COUNT_TIMEFRAMES == {'15s', '1m', '3m'}
          assert PROFIT_TIMEFRAME == '5m'
          assert 'smart_confluence' in PROFIT_STRATEGIES
          assert MIN_AUTO_PAYOUT == 92.0

          count = _validate_config({
              'mode': 'count', 'strategy': 'trend_pulse', 'timeframe': '15s',
              'target_wins': 5, 'amount': 1, 'max_martingale': 3,
          })
          assert count['target_wins'] == 5 and count['max_martingale'] == 3

          profit = _validate_config({
              'mode': 'profit', 'strategy': 'smart_confluence',
              'target_profit': 10, 'amount': 1, 'max_martingale': 2,
              'max_failed_series': 2,
          })
          assert profit['timeframe'] == '5m' and profit['max_failed_series'] == 2
          print('Strategy/session rules OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniapp/package.json

      - name: Install Mini App dependencies
        working-directory: miniapp
        run: npm install --no-audit --no-fund

      - name: Build Mini App
        working-directory: miniapp
        run: npm run build

      - name: Verify new Mini App flows
        working-directory: miniapp
        run: |
          grep -R -q 'Сигнал из реального' dist/assets/*.js
          grep -R -q 'VIP 5M Confluence' dist/assets/*.js
          grep -R -q 'Trading Session' dist/assets/*.js
          grep -R -q 'По WIN-сделкам' dist/assets/*.js
          grep -R -q 'До профита' dist/assets/*.js
          grep -R -q 'Автотрейдинг' dist/assets/*.js
          echo 'Mini App flows OK'

      - name: Verify stale Telegram asset recovery
        env:
          ADMIN_ID: '8535011479'
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.main import app
          with TestClient(app) as client:
              root = client.get('/')
              assert root.status_code == 200, root.text
              assert root.headers.get('cache-control') == 'no-store, max-age=0'
              stale_js = client.get('/assets/index-stale-telegram-cache.js')
              assert stale_js.status_code == 200, stale_js.text
              assert stale_js.headers.get('x-alphapulse-asset-recovery') == '1'
              stale_css = client.get('/assets/index-stale-telegram-cache.css')
              assert stale_css.status_code == 200, stale_css.text
              assert stale_css.headers.get('x-alphapulse-asset-recovery') == '1'
          print('Stale asset recovery OK')
          PY
