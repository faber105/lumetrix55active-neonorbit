name: Validate AlphaPulse

on:
  push:
    branches: [main, codex-windows-worker-rebuild]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alphapulse-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -q -r requirements.txt pytest

      - name: Compile Python
        run: python -m compileall -q api backend bot worker tests

      - name: Run worker and session tests
        env:
          APP_RUNTIME_ROLE: web
          ADMIN_ID: '8535011479'
          DATABASE_URL: 'postgresql://alpha:alphapulse123@localhost:5432/alphapulse'
          TELEGRAM_BOT_TOKEN: '123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijk'
        run: |
          pytest -q \
            tests/test_runtime_role.py \
            tests/test_security_boundaries.py \
            tests/test_realtime_tokens.py \
            tests/test_command_idempotency.py \
            tests/test_auto_session_config.py \
            tests/test_session_loss_transition.py \
            tests/test_session_settle_transition.py \
            tests/test_fake_broker_scenarios.py \
            tests/test_worker_lease_gate.py

      - name: Verify rebuilt worker boundaries
        env:
          APP_RUNTIME_ROLE: web
          ADMIN_ID: '8535011479'
          DATABASE_URL: 'postgresql://alpha:alphapulse123@localhost:5432/alphapulse'
        run: |
          python - <<'PY'
          from backend.services.auto_realtime import realtime_driver_enabled
          from backend.services.auto_trade import MIN_AUTO_PAYOUT
          from backend.services.session_engine import AUTO_TIMEFRAMES, validate_session_config
          from backend.services.session_transitions import settle_transition

          assert realtime_driver_enabled() is False
          assert MIN_AUTO_PAYOUT == 92.0
          assert {'15s','1m','3m','5m','15m'} == AUTO_TIMEFRAMES
          values = validate_session_config({
              'mode':'count','strategy':'trend_pulse','timeframe':'15s',
              'target_wins':5,'amount':1,'max_martingale':3,
          })
          assert values['target_wins'] == 5
          assert values['max_martingale'] == 3
          state = {
              'mode':'count','target_wins':5,'wins':0,'failed_series':0,
              'current_level':0,'current_series_loss':0,'profit':0,
              'max_martingale':3,'max_failed_series':1,
          }
          first_loss = settle_transition(state, result='LOSS', amount=1, payout=92)
          assert first_loss['status'] == 'ACTIVE'
          assert first_loss['level'] == 1
          assert first_loss['stage'] == 'SCANNING'
          print('Worker/session boundaries OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Install Mini App dependencies
        working-directory: miniapp
        run: npm ci --no-audit --no-fund

      - name: Lint and build Mini App
        working-directory: miniapp
        run: |
          npm run lint --if-present
          npm run build

      - name: Verify Mini App AUTO transport
        working-directory: miniapp
        run: |
          grep -R -q '/api/auto/state' dist/assets/*.js
          grep -R -q '/ws/auto' dist/assets/*.js
          grep -R -q 'Автотрейдинг' dist/assets/*.js
          echo 'Mini App AUTO transport OK'
