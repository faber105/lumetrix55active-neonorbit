name: Telegram Runtime Switch

on:
  push:
    paths:
      - '.github/workflows/telegram-runtime-switch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEMP_DATABASE_URL: postgresql://telegram_switch_once:_OdCftfAujbYvWMqqAjg0zE9LzE@ep-mute-grass-at4o3fo5-pooler.c-9.us-east-1.aws.neon.tech/alphapulsesbot?sslmode=require
      RUNTIME_URL: https://alphapulse-runtime-staging.vercel.app
      ADMIN_CHAT_ID: '8535011479'
    steps:
      - uses: actions/checkout@v4

      - name: Load bot token from temporary read-only Neon view
        id: token
        shell: bash
        run: |
          python -m pip install -q 'psycopg[binary]>=3.2,<4'
          TOKEN=$(python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['TEMP_DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  cur.execute('select bot_token from public.telegram_switch_view limit 1')
                  row = cur.fetchone()
          if not row or not row[0]:
              raise SystemExit('bot token not available')
          print(row[0], end='')
          PY
          )
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Warm runtime before switching webhook
        shell: bash
        run: curl --fail --silent --show-error "$RUNTIME_URL/health" >/dev/null

      - name: Switch webhook and Telegram menu
        id: telegram
        env:
          BOT_TOKEN: ${{ steps.token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          SECRET=$(BOT_TOKEN="$BOT_TOKEN" python - <<'PY'
          import hashlib, os
          print(hashlib.sha256(f"alphapulsesbot:{os.environ['BOT_TOKEN']}".encode()).hexdigest())
          PY
          )

          WEBHOOK_JSON=$(curl --fail --silent --show-error -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${RUNTIME_URL}/telegram/webhook" \
            --data-urlencode "secret_token=${SECRET}" \
            --data-urlencode "drop_pending_updates=false")

          MENU_PAYLOAD=$(python - <<'PY'
          import json, os
          print(json.dumps({
            'menu_button': {
              'type': 'web_app',
              'text': 'AlphaPulse Live',
              'web_app': {'url': os.environ['RUNTIME_URL']}
            }
          }))
          PY
          )
          MENU_JSON=$(curl --fail --silent --show-error -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/setChatMenuButton" \
            -H 'Content-Type: application/json' \
            -d "$MENU_PAYLOAD")

          MESSAGE_PAYLOAD=$(python - <<'PY'
          import json, os
          print(json.dumps({
            'chat_id': int(os.environ['ADMIN_CHAT_ID']),
            'text': '✅ AlphaPulse Live готов. Открой Mini App кнопкой ниже — активные сделки и свечи обновляются автоматически.',
            'reply_markup': {
              'inline_keyboard': [[{
                'text': '⚡ Открыть AlphaPulse Live',
                'web_app': {'url': os.environ['RUNTIME_URL']}
              }]]
            }
          }, ensure_ascii=False))
          PY
          )
          MESSAGE_JSON=$(curl --fail --silent --show-error -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$MESSAGE_PAYLOAD")

          GETME_JSON=$(curl --fail --silent --show-error \
            "https://api.telegram.org/bot${BOT_TOKEN}/getMe")

          WEBHOOK_JSON="$WEBHOOK_JSON" MENU_JSON="$MENU_JSON" MESSAGE_JSON="$MESSAGE_JSON" GETME_JSON="$GETME_JSON" python - <<'PY'
          import json, os
          w=json.loads(os.environ['WEBHOOK_JSON'])
          m=json.loads(os.environ['MENU_JSON'])
          s=json.loads(os.environ['MESSAGE_JSON'])
          g=json.loads(os.environ['GETME_JSON'])
          username=(g.get('result') or {}).get('username','unknown')
          with open('telegram-switch-status.txt','w') as f:
              f.write(f"webhook_ok={str(bool(w.get('ok'))).lower()}\n")
              f.write(f"menu_ok={str(bool(m.get('ok'))).lower()}\n")
              f.write(f"message_ok={str(bool(s.get('ok'))).lower()}\n")
              f.write(f"bot_username={username}\n")
          if not all(x.get('ok') for x in (w,m,s,g)):
              raise SystemExit('Telegram API returned failure')
          PY

      - name: Record switch result
        if: always()
        shell: bash
        run: |
          if [ ! -f telegram-switch-status.txt ]; then
            printf 'webhook_ok=false\nmenu_ok=false\nmessage_ok=false\nbot_username=unknown\n' > telegram-switch-status.txt
          fi
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" >> telegram-switch-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram-switch-status.txt
          git commit -m "Record Telegram runtime switch status" || exit 0
          git push
