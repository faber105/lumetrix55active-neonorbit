name: Repair Telegram Webhook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'api/**'
      - 'bot/**'
      - '.github/workflows/telegram-webhook-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait for production and repair webhook
        env:
          REPAIR_URL: https://lumetrix55active-neonorbit.vercel.app/api/internal/telegram-repair
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            echo "Webhook repair attempt $i/30"
            if RESPONSE=$(curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 25 \
              -X POST "$REPAIR_URL"); then
              echo "$RESPONSE"
              python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True, data' <<<"$RESPONSE"
              exit 0
            fi
            sleep 6
          done
          echo "Production webhook repair did not become ready in time"
          exit 1
