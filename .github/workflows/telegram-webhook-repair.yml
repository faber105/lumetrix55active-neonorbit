name: Repair Telegram Webhook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'api/**'
      - 'bot/**'
      - '.github/workflows/telegram-webhook-repair.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for production and repair webhook
        env:
          REPAIR_URL: https://lumetrix55active-neonorbit.vercel.app/api/internal/telegram-repair
        shell: bash
        run: |
          set -u
          for i in $(seq 1 40); do
            echo "Webhook repair attempt $i/40"
            BODY_FILE=$(mktemp)
            ERR_FILE=$(mktemp)
            HTTP_CODE=$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' --connect-timeout 5 --max-time 25 -X POST "$REPAIR_URL" 2>"$ERR_FILE")
            CURL_RC=$?
            BODY=$(cat "$BODY_FILE")
            CURL_ERR=$(cat "$ERR_FILE")
            rm -f "$BODY_FILE" "$ERR_FILE"
            echo "HTTP=$HTTP_CODE curl_rc=$CURL_RC body=$BODY error=$CURL_ERR"

            if [ "$CURL_RC" -eq 0 ] && [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
              OK=$(printf '%s' "$BODY" | jq -r '.ok // false' 2>/dev/null || true)
              if [ "$OK" = "true" ]; then
                echo "Telegram webhook repaired successfully"
                exit 0
              fi
            fi
            sleep 6
          done

          echo "Telegram webhook repair failed after all attempts"
          exit 1
