name: AlphaPulse OTC Scanner (retired)

# Persistent AUTO scanning is owned exclusively by the Windows worker.
# Keep this workflow as a manual diagnostic stub so merging the worker rebuild
# cannot leave the old scheduled Render/GitHub driver running in parallel.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain runtime ownership
        run: |
          echo "Legacy cloud AUTO scanner is retired."
          echo "Run AlphaPulse AUTO only through the leased Windows worker."
