name: AlphaPulse OTC Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'bot/**'
      - 'api/**'
      - '.github/workflows/otc-scan.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: alphapulsesbot-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Trigger 5-second scanner window
        env:
          SCAN_URL: https://alphapulse-runtime-staging.vercel.app/api/internal/scan
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then sleep 65; fi
          for i in $(seq 1 52); do
            START=$(date +%s)
            TOKEN_JSON=$(curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=alphapulsesbot-scanner")
            TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$TOKEN_JSON")
            curl --fail --silent --show-error --retry 1 \
              -X POST "$SCAN_URL" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json"
            if [ "$i" -lt 52 ]; then
              ELAPSED=$(( $(date +%s) - START ))
              SLEEP_FOR=$(( 5 - ELAPSED ))
              if [ "$SLEEP_FOR" -gt 0 ]; then sleep "$SLEEP_FOR"; fi
            fi
          done
