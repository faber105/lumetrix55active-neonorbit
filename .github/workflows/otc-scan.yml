name: AlphaPulse OTC Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'bot/**'
      - 'api/**'
      - '.github/workflows/otc-scan.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: alphapulsesbot-scanner-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Run adaptive AUTO scanner window
        env:
          SCAN_URL: https://lumetrix55active-neonorbit.vercel.app/api/internal/auto-tick
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then sleep 35; fi

          DEADLINE=$(( $(date +%s) + 285 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            START=$(date +%s)
            TOKEN_JSON=$(curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=alphapulsesbot-scanner")
            TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$TOKEN_JSON")

            RESPONSE=$(curl --fail --silent --show-error --retry 1 \
              --connect-timeout 5 --max-time 30 \
              -X POST "$SCAN_URL" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json")

            POLL_AFTER=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(max(1.0,min(20.0,float(d.get("poll_after",5.0)))))' <<<"$RESPONSE" 2>/dev/null || echo 5)
            ELAPSED=$(( $(date +%s) - START ))
            SLEEP_FOR=$(python3 -c 'import sys; print(max(0.0,float(sys.argv[1])-float(sys.argv[2])))' "$POLL_AFTER" "$ELAPSED")
            python3 -c 'import sys,time; time.sleep(float(sys.argv[1]))' "$SLEEP_FOR"
          done
