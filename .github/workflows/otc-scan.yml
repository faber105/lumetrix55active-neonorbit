name: AlphaPulse OTC Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: alphapulsesbot-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger serverless scanner window
        env:
          SCAN_URL: https://alphapulse-otc.vercel.app/api/internal/scan
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 19); do
            START=$(date +%s)
            TOKEN_JSON=$(curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=alphapulsesbot-scanner")
            TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$TOKEN_JSON")
            curl --fail --silent --show-error --retry 2 \
              -X POST "$SCAN_URL" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json"
            if [ "$i" -lt 19 ]; then
              ELAPSED=$(( $(date +%s) - START ))
              SLEEP_FOR=$(( 15 - ELAPSED ))
              if [ "$SLEEP_FOR" -gt 0 ]; then sleep "$SLEEP_FOR"; fi
            fi
          done
