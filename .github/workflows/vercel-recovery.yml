name: Vercel Production Recovery

on:
  push:
    paths:
      - '.github/workflows/vercel-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll production back to last known-good deployment
        id: rollback
        if: steps.token.outputs.available == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          status=$(curl --silent --show-error --output /tmp/vercel-body --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/projects/prj_NDoUvOIYpOZAC5ggrMSZkuu1ApY6/rollback/dpl_3SaPpYLgz34asfcm6JdXmAx8E5HZ?teamId=team_VlqXJ1nwJeUfS9qzIqK5Em0o&description=AlphaPulse%20recovery" || true)
          echo "http_status=${status:-curl_failed}" >> "$GITHUB_OUTPUT"

      - name: Write recovery status
        if: always()
        env:
          TOKEN_AVAILABLE: ${{ steps.token.outputs.available }}
          ROLLBACK_STATUS: ${{ steps.rollback.outputs.http_status }}
        shell: bash
        run: |
          printf 'token_available=%s\nrollback_http_status=%s\nrun_id=%s\n' \
            "${TOKEN_AVAILABLE:-false}" "${ROLLBACK_STATUS:-not_run}" "$GITHUB_RUN_ID" > recovery-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovery-status.txt
          git commit -m "Record Vercel recovery status" || exit 0
          git push
