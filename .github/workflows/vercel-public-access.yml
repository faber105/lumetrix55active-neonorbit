name: Deploy Public Vercel Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vercel-public-access.yml'
      - 'vercel.json'
      - 'api/**'
      - 'backend/**'
      - 'bot/**'
      - 'miniapp/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alphapulse-vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_VlqXJ1nwJeUfS9qzIqK5Em0o
  VERCEL_PROJECT_ID: prj_NDoUvOIYpOZAC5ggrMSZkuu1ApY6

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || (echo "VERCEL_TOKEN is not configured" && exit 1)

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Disable Vercel Authentication
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/vercel-project --write-out '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"ssoProtection":null}' \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          cat /tmp/vercel-project
          echo "HTTP $status"
          test "$status" -ge 200 -a "$status" -lt 300

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url"

      - name: Verify public production domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            code=$(curl --silent --show-error --location --output /tmp/alphapulse-home --write-out '%{http_code}' https://alphapulse-otc.vercel.app/ || true)
            final=$(curl --silent --show-error --location --output /dev/null --write-out '%{url_effective}' https://alphapulse-otc.vercel.app/ || true)
            health=$(curl --silent --show-error --output /tmp/alphapulse-health --write-out '%{http_code}' https://alphapulse-otc.vercel.app/health || true)
            echo "attempt=$attempt home=$code health=$health final=$final"
            if [ "$code" = "200" ] && [ "$health" = "200" ] && [[ "$final" != *"vercel.com/sso-api"* ]]; then
              cat /tmp/alphapulse-health
              exit 0
            fi
            sleep 5
          done
          echo "Production domain is still protected or unavailable"
          exit 1
